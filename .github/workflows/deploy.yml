name: Build & Deploy to AWS

# Every push to main builds the Docker image, pushes it to Amazon ECR, and
# (if configured) triggers an AWS App Runner deployment. Nothing runs locally.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          docker build --build-arg SEED_PASSWORD="$SEED_PASSWORD" -t "$REGISTRY/$REPO:latest" -t "$REGISTRY/$REPO:$TAG" .
          docker push "$REGISTRY/$REPO:latest"
          docker push "$REGISTRY/$REPO:$TAG"

      # The ECS task definition pins an image digest, so a plain
      # --force-new-deployment would just restart the old image. Register a new
      # task-definition revision pointing at this commit's image and roll to it.
      - name: Deploy new image to ECS
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER || 'default' }}
          SERVICE: ${{ vars.ECS_SERVICE || 'liberia-emr-francordsoft' }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE"                  --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
          echo "Current task definition: $TD"
          aws ecs describe-task-definition --task-definition "$TD" --query taskDefinition             | jq --arg IMG "$IMAGE" '.containerDefinitions[0].image = $IMG
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy)' > td.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://td.json                      --query taskDefinition.taskDefinitionArn --output text)
          echo "New task definition: $NEW_TD -> $IMAGE"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE"             --task-definition "$NEW_TD" --force-new-deployment             --query 'service.deployments[0].id' --output text
          # Fail the job if the new tasks never become healthy.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" || {
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE"               --query 'services[0].events[:10].message' --output text; exit 1; }
          for T in $(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --query 'taskArns[]' --output text); do
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$T"               --query 'tasks[0].[startedAt,containers[0].image]' --output text
          done
